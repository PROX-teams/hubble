name: Java CI with Gradle and Deploy to EC2

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때 작동합니다.

defaults:
  run:
    working-directory: server # 모든 실행 명령어의 기본 시작점을 server 폴더로 설정합니다.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build api module with Gradle
      run: ./gradlew :api:build -x test

    # JAR 파일 및 Docker 설정 파일들을 한 번에 전송
    # strip_components: 1 을 사용하여 'server/' 폴더만 제외하고 구조를 유지합니다.
    - name: Copy Build Artifacts to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "server/api/build/libs/*.jar,server/docker-compose.yml,server/Dockerfile"
        target: "~/app"
        strip_components: 1
        rm: true # 배포 시작 시 기존 ~/app 폴더를 깨끗이 비웁니다.

    - name: Execution on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd ~/app
          
          # 환경 변수 주입과 함께 도커 컴포즈 실행
          # --build 옵션으로 전송된 새 JAR 파일을 포함하여 이미지를 다시 빌드합니다.
          DB_USERNAME=${{ secrets.DB_USERNAME }} \
          DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
          JWT_SECRET=${{ secrets.JWT_SECRET }} \
          sudo -E docker compose up -d --build
          
          # 사용하지 않는 오래된 이미지 정리 (선택 사항)
          sudo docker image prune -f
