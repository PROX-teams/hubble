name: Java CI with Gradle and Deploy to EC2

on:
  push:
    branches: [ "main" ]

defaults:
  run:
    working-directory: server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build api module with Gradle
      run: ./gradlew :api:build -x test

    - name: Copy JAR and Docker files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "server/api/build/libs/*.jar,!server/api/build/libs/*-plain.jar,server/docker-compose.yml"
        target: "~/app"
        strip_components: 4
        rm: true

    - name: Execution on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # 1. 전송된 파일 위치 정리
          find ~/app -name "docker-compose.yml" -exec mv {} ~/app/ \;
          mv ~/app/server/api/build/libs/*.jar ~/app/ || true
          rm -rf ~/app/server
          
          # 2. 도커 컴포즈 실행 (환경 변수 주입을 통해 보안 강화)
          # -E 옵션과 함께 환경 변수를 전달하여 docker-compose.yml이 이를 읽도록 합니다.
          cd ~/app
          DB_USERNAME=${{ secrets.DB_USERNAME }} \
          DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
          sudo -E docker compose up -d
          
          # 3. 기존 스프링 부트 프로세스 종료
          sudo fuser -k 8080/tcp || true
          
          # 4. 새 프로세스 실행 (MySQL 접속 정보 주입)
          nohup java -jar ~/app/*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/hubble?serverTimezone=UTC&characterEncoding=UTF-8 \
            --spring.datasource.username=${{ secrets.DB_USERNAME }} \
            --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
            --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
            --jwt.secret=${{ secrets.JWT_SECRET }} \
            --spring.jpa.hibernate.ddl-auto=update \
            --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect \
            > ~/app/nohup.out 2>&1 &
