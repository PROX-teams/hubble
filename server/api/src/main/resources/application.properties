spring.application.name=server

# JWT Settings (환경 변수 우선, 없으면 기본값)
jwt.secret=${JWT_SECRET:hubble-project-secret-key-for-jwt-token-generation-2024-03-10}
jwt.access-token-validity-in-seconds=3600
jwt.refresh-token-validity-in-seconds=1209600

# Database (환경 변수 우선, 기본 MySQL 설정)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hubble?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hubble}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# V1 represents the existing schema; pre-Flyway databases are baselined at V1.
# Fresh databases execute V1, then V2 and future migrations in order.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Enable only after V4, graph rank backfill, and Kafka are ready.
graph.async.enabled=${GRAPH_ASYNC_ENABLED:false}
graph.worker.enabled=${GRAPH_WORKER_ENABLED:false}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.task.scheduling.pool.size=${GRAPH_SCHEDULER_THREADS:4}
