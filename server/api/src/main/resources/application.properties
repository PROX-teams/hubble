spring.application.name=server

# JWT Settings (환경 변수 우선, 없으면 기본값)
jwt.secret=${JWT_SECRET:hubble-project-secret-key-for-jwt-token-generation-2024-03-10}
jwt.access-token-validity-in-seconds=3600
jwt.refresh-token-validity-in-seconds=1209600

# Database (환경 변수로부터 읽어옴)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 Console (개발 편의성)
spring.h2.console.enabled=true
