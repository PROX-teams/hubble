services:
  db:
    image: mysql:8.0
    container_name: hubble-db
    restart: always
    environment:
      MYSQL_DATABASE: hubble
      MYSQL_USER: ${DB_USERNAME:-hubble}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hubble1234}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  kafka:
    image: apache/kafka:4.3.1
    container_name: hubble-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    image: hubble-server:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubble-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/hubble?serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-hubble}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-hubble1234}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - JWT_SECRET=${JWT_SECRET:-hubble-project-secret-key-for-jwt-token-generation-2024-03-10}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - GRAPH_ASYNC_ENABLED=${GRAPH_ASYNC_ENABLED:-false}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - db
      - kafka

  graph-worker:
    image: hubble-server:local
    profiles:
      - graph-async
    container_name: hubble-graph-worker
    restart: always
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/hubble?serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-hubble}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-hubble1234}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - GRAPH_ASYNC_ENABLED=true
      - GRAPH_WORKER_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-hubble-project-secret-key-for-jwt-token-generation-2024-03-10}
    depends_on:
      - db
      - kafka

volumes:
  mysql-data:
